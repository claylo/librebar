# Security policy configuration for librebar

# ==============================================================================
# License Management
# ==============================================================================

[licenses]
allow = [
    # Permissive licenses (OSI approved)
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",      # Boost Software License
    "ISC",
    "MIT",
    "MIT-0",        # MIT No Attribution
    "MPL-2.0",      # Mozilla Public License (weak copyleft, permissive for linking)
    "Zlib",

    # Public domain dedications
    "0BSD",         # Zero-Clause BSD
    "CC0-1.0",      # Creative Commons Zero
    "Unlicense",

    # Unicode/text processing
    "Unicode-3.0",

    # Data licenses (Linux Foundation, OSI-permissive-equivalent for data catalogs).
    # `webpki-roots` ships Mozilla's curated CA-certificate list under this
    # license because what it distributes is data, not code.
    "CDLA-Permissive-2.0",
]

confidence-threshold = 0.8
unused-allowed-license = "allow"

# ==============================================================================
# Security Advisories
# ==============================================================================

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]

# Accepted advisories.
#
# Empty. RUSTSEC-2025-0141 (bincode 1.3.3 unmaintained) was ignored here while
# gungraun pinned `bincode = "1"`. gungraun 0.19.4 migrated to `bincode-next`
# 2.x, so bincode 1.x is no longer in the graph and the suppression was removed.
ignore = []

# ==============================================================================
# Banned Dependencies
# ==============================================================================

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
deny = []
skip = [
    # OpenTelemetry's protobuf/Tonic stack still requires base64 0.22; remove
    # when that stack joins Librebar, RMCP, and serde-saphyr on 0.23.
    "base64@0.22.1",
    # const-hex (through opentelemetry-proto) still requires cpufeatures 0.2;
    # remove when it joins sha2 0.11 on cpufeatures 0.3.
    "cpufeatures@0.2.17",
    # ring/redox_users still require getrandom 0.2; remove when both advance.
    "getrandom@0.2.17",
    # rand 0.9 (through OpenTelemetry) still requires getrandom 0.3; remove
    # when it joins tempfile and RMCP's uuid on getrandom 0.4.
    "getrandom@0.3.4",
    # The older target-gated r-efi follows getrandom 0.3; remove with that
    # getrandom exception.
    "r-efi@5.3.0",
    # owo-colors deliberately enables both supports-color majors; remove only
    # when upstream drops the compatibility implementation.
    "supports-color@2.1.0",
    # The async/derive ecosystem still spans syn 2 and 3; remove when the
    # remaining darling, futures, tracing, RMCP, and codegen macros reach 3.
    "syn@2.0.119",
    # ring still requires windows-sys 0.52; remove when it joins the rest of
    # the graph on 0.61 or later.
    "windows-sys@0.52.0",
]

[[bans.features]]
crate = "base64@0.23"
deny = ["simd-unsafe"]

# ==============================================================================
# Source Control
# ==============================================================================

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
