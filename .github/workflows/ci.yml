name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key-suffix: lint
          toolchain: stable

      - name: rustfmt
        run: cargo fmt --check -- --config-path .config/rustfmt.toml

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key-suffix: test
          toolchain: stable

      - name: Install nextest
        uses: ./.github/actions/setup-cargo-tools
        with:
          binstall-tools: cargo-nextest

      - name: nextest
        run: cargo nextest run --workspace --all-features --profile ci

      - name: doctests
        run: cargo test --doc --all-features

  feature-matrix:
    name: feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key-suffix: feature-matrix
          toolchain: stable

      - name: Install cargo-hack
        uses: ./.github/actions/setup-cargo-tools
        with:
          binstall-tools: cargo-hack

      - name: Check feature matrix
        run: cargo hack check --each-feature --no-dev-deps

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action composes `cargo-deny <arguments> <command> <command-arguments>`.
      #
      # `--config` position is cargo-deny-version-specific and the two forms are
      # mutually exclusive: <=0.19.x accepts it ONLY after the subcommand, 0.20+
      # ONLY before it. So the action release matters — v2.1.1 is the first that
      # bundles cargo-deny 0.20.2, matching the version `just deny` runs locally.
      # Keep this pin and .justfile's `deny` recipe in step; if they drift apart,
      # one of the two starts failing on the `--config` placement.
      #
      # `arguments` defaults to `--all-features`, restated here because setting
      # it overrides the default.
      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --config .config/deny.toml

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Cargo.toml ]; then
            echo "found=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          msrv="$(awk -F= '
            /^[[:space:]]*rust-version[[:space:]]*=/ {
              v=$2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", v)
              gsub(/"/, "", v)
              print v
              exit
            }
          ' Cargo.toml || true)"

          if [ -z "${msrv}" ]; then
            echo "found=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >>"$GITHUB_OUTPUT"
          echo "msrv=${msrv}" >>"$GITHUB_OUTPUT"

      - name: Rust toolchain (MSRV)
        if: steps.msrv.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Rust cache
        if: steps.msrv.outputs.found == 'true'
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key-suffix: msrv
          toolchain: ${{ steps.msrv.outputs.msrv }}

      # RUSTUP_TOOLCHAIN is required, not belt-and-braces. rustup's override
      # order is: `+toolchain` arg > RUSTUP_TOOLCHAIN > directory override >
      # rust-toolchain.toml > default toolchain. dtolnay/rust-toolchain sets the
      # toolchain via `rustup default`, which rust-toolchain.toml outranks — so a
      # bare `cargo check` here silently resolves to the pinned build channel and
      # this job asserts nothing about the MSRV.
      - name: cargo check (MSRV)
        if: steps.msrv.outputs.found == 'true'
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
        run: cargo check --all-targets --all-features
