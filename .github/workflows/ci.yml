name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key-suffix: lint
          toolchain: stable

      - name: Install just
        uses: ./.github/actions/setup-cargo-tools
        with:
          binstall-tools: just

      - name: rustfmt
        run: just fmt-check

      - name: clippy
        run: just clippy

      - name: rustdoc
        run: just doc

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key-suffix: test
          toolchain: stable

      - name: Install test tools
        uses: ./.github/actions/setup-cargo-tools
        with:
          binstall-tools: just cargo-nextest

      - name: nextest
        run: just test-ci

      - name: doctests
        run: just doc-test

  feature-matrix:
    name: feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key-suffix: feature-matrix
          toolchain: stable

      - name: Install feature tools
        uses: ./.github/actions/setup-cargo-tools
        with:
          binstall-tools: just cargo-hack

      - name: Check feature matrix
        run: just feature-matrix

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependency tools
        uses: ./.github/actions/setup-cargo-tools
        with:
          binstall-tools: just cargo-deny@0.20.2

      - name: Check dependencies
        run: just deny

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Cargo.toml ]; then
            echo "found=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          msrv="$(awk -F= '
            /^[[:space:]]*rust-version[[:space:]]*=/ {
              v=$2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", v)
              gsub(/"/, "", v)
              print v
              exit
            }
          ' Cargo.toml || true)"

          if [ -z "${msrv}" ]; then
            echo "found=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >>"$GITHUB_OUTPUT"
          echo "msrv=${msrv}" >>"$GITHUB_OUTPUT"

      - name: Rust toolchain (MSRV)
        if: steps.msrv.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Rust cache
        if: steps.msrv.outputs.found == 'true'
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key-suffix: msrv
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Install just
        if: steps.msrv.outputs.found == 'true'
        uses: ./.github/actions/setup-cargo-tools
        with:
          binstall-tools: just

      # RUSTUP_TOOLCHAIN is required, not belt-and-braces. rustup's override
      # order is: `+toolchain` arg > RUSTUP_TOOLCHAIN > directory override >
      # rust-toolchain.toml > default toolchain. dtolnay/rust-toolchain sets the
      # toolchain via `rustup default`, which rust-toolchain.toml outranks — so a
      # bare `cargo check` here silently resolves to the pinned build channel and
      # this job asserts nothing about the MSRV.
      - name: cargo check (MSRV)
        if: steps.msrv.outputs.found == 'true'
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
        run: just msrv-check
