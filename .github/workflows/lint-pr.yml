name: 'Lint PR'

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      # - synchronize (if you use required Actions)

# `pull_request_target` runs against the base repo with a write-capable token,
# so deny everything by default and let each job opt into exactly what it needs.
# Without this, a job added later that omits its own `permissions:` block would
# inherit the repository default rather than nothing.
permissions: {}

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

