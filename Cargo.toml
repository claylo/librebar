[package]
name = "librebar"
version = "0.4.0"
edition = "2024"
rust-version = "1.89.0"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/claylo/librebar"
homepage = "https://github.com/claylo/librebar"
documentation = "https://docs.rs/librebar"
description = "Opinionated application foundation for Rust CLIs and services"
keywords = ["cli", "config", "logging", "tracing", "mcp"]
categories = ["command-line-interface", "config", "development-tools"]
exclude = [
    "/.claude/",
    "/.github/",
    "/.handoffs/",
    "/.config",
    "/.justfile",
    "/bench-reports/",
    "/scripts/",
    "/docs/",
    "/scratch/",
    "/record/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Always present (core)
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "2.0"

# Feature: cli
clap = { version = "4.6", features = ["derive"], optional = true }
clap_complete = { version = "4.6", optional = true }
clap_mangen = { version = "0.3", optional = true }
owo-colors = { version = "4.3", features = ["supports-colors"], optional = true }

# Feature: config
toml = { version = "1.1", optional = true }
serde-saphyr = { version = "1.0", default-features = false, features = ["deserialize"], optional = true }
serde_json = { version = "1.0", optional = true }
serde_path_to_error = { version = "0.1.20", optional = true }
camino = { version = "1.2", features = ["serde1"], optional = true }
directories = { version = "6.0", optional = true }

# Feature: logging
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-appender = { version = "0.2.5", optional = true }

# Feature: shutdown
tokio = { version = "1.52", features = ["rt", "macros", "signal", "sync", "time"], optional = true }

# Feature: otel
async-trait = { version = "0.1", optional = true }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry-http = { version = "0.32", default-features = false, features = ["hyper"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "hyper-client", "trace"], optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }

# Feature: mcp
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-io"], optional = true }

# Feature: http
bytes = { version = "1.12", optional = true }
http = { version = "1.4", optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.9", features = ["client", "http1", "http2"], optional = true }
# Deliberately prefer ring over hyper-rustls's aws-lc-rs default. Both cross the
# C/assembly boundary; ring is the smaller audited surface. Revisit when a
# pure-Rust rustls provider reaches production parity or FIPS requires AWS-LC.
hyper-rustls = { version = "0.27", features = ["http1", "http2", "ring", "webpki-tokio"], default-features = false, optional = true }
rustls = { version = "0.23.40", default-features = false, optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.7", features = ["decompression-br", "decompression-gzip", "follow-redirect"], optional = true }

# Feature: http-cache
http-cache-semantics = { version = "3.0", optional = true }
sha2 = { version = "0.11", optional = true }

# Feature: http-cookies
cookie_store = { version = "0.22", default-features = false, features = ["public_suffix", "serde_json"], optional = true }
atomic-write-file = { version = "0.3", optional = true }
publicsuffix = { version = "2.3", optional = true }
url = { version = "2.5", optional = true }

# Feature: cache
# Keep base64's `simd-unsafe` default disabled across the complete graph; the
# cargo-deny feature ban rejects any transitive dependency that re-enables it.
# `std` re-enables `alloc`; cache needs only the safe STANDARD codec.
base64 = { version = "0.23", default-features = false, features = ["std"], optional = true }
tempfile = { version = "3.27", optional = true }

# Feature: update
semver = { version = "1.0", optional = true }

# Feature: dispatch
which = { version = "8.0", optional = true }

# Feature: diagnostics
leakguard = { version = "0.8", default-features = false, features = ["std"], optional = true }
rust-zstd = { version = "0.1", default-features = false, optional = true }
tar = { version = "0.4", default-features = false, optional = true }

# Feature: bench (wall-clock via divan)
divan = { version = "0.1", optional = true }

# Feature: bench-gungraun (instruction-count via Valgrind/Callgrind)
gungraun = { version = "0.19", optional = true }

[dev-dependencies]
tempfile = "3.27"
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt", "macros", "time"] }
anyhow = "1.0"
flate2 = "1.1"
brotli = "8.0"

[[example]]
name = "minimal"
required-features = ["cli", "config", "logging"]

[[example]]
name = "service"
required-features = ["cli", "config", "logging", "shutdown", "crash", "otel"]

[[example]]
name = "updater"
required-features = ["cli", "config", "logging", "http", "cache", "update"]

[[example]]
name = "http-cookies"
required-features = ["http-cookies"]

[[example]]
name = "http-cache"
required-features = ["http-cache"]

[[example]]
name = "plugin-cli"
path = "examples/plugin-cli/main.rs"
required-features = ["cli", "config", "logging", "dispatch"]

[[example]]
name = "doctor-bundle"
required-features = ["cli", "config", "logging", "diagnostics"]

[[example]]
name = "mcp-server"
required-features = ["cli", "config", "logging", "mcp"]

[[example]]
name = "plugin-cli-hello-greet"
path = "examples/plugin-cli/hello-greet/main.rs"
required-features = ["cli"]

[[bench]]
name = "cache"
harness = false
required-features = ["bench", "cache"]

[features]
default = ["cli", "config", "logging", "crash", "cache", "diagnostics"]
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:owo-colors", "dep:serde_json"]
config = ["dep:toml", "dep:serde-saphyr", "dep:serde_json", "dep:serde_path_to_error", "dep:camino", "dep:directories"]
logging = ["dep:tracing-subscriber", "dep:tracing-appender", "dep:serde_json", "dep:directories", "dep:rust-zstd"]
shutdown = ["dep:tokio"]
crash = ["dep:serde_json"]
otel = ["logging", "dep:async-trait", "dep:opentelemetry", "dep:opentelemetry-http", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:tokio"]
otel-http-json = ["otel", "opentelemetry-otlp/http-json"]
otel-grpc = ["otel", "opentelemetry-otlp/grpc-tonic"]
mcp = ["dep:rmcp", "dep:tokio"]
lockfile = ["dep:directories"]
http = ["dep:bytes", "dep:http", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyper-rustls", "dep:rustls", "dep:tokio", "dep:serde_json", "dep:tower", "dep:tower-http"]
http-cookies = ["http", "dep:cookie_store", "dep:atomic-write-file", "dep:publicsuffix", "dep:url"]
http-cache = ["http", "cache", "dep:http-cache-semantics", "dep:sha2"]
cache = ["dep:serde_json", "dep:directories", "dep:base64", "dep:tempfile"]
update = ["http", "cache", "dep:async-trait", "dep:semver", "dep:serde_json"]
dispatch = ["cli", "dep:which"]
diagnostics = ["config", "logging", "dep:leakguard", "dep:rust-zstd", "dep:tar"]
bench = ["dep:divan"]
bench-gungraun = ["dep:gungraun"]

[lints.rust]
# Encourage documentation - warn on public items missing docs
missing_docs = "warn"

[lints.clippy]
all = "warn"
nursery = "warn"

# Local workspace profiles only; downstream consumers control their own profiles.
# Drop dependency debug info to keep local build artifacts small.
[profile.dev.package."*"]
debug = 0

[profile.dev.build-override]
debug = 0
opt-level = 1

# Reduce debug info size (line tables only, no variable info)
# Light optimization for better runtime without killing incremental builds
[profile.dev]
debug = "line-tables-only"
opt-level = 1
# On macOS, keep debug info from exploding into huge scattered dSYM trees
split-debuginfo = "packed"

# Test profile with full debug symbols for profiling
[profile.test]
inherits = "dev"
debug = true

# Release profile with reduced debug info
[profile.release]
debug = "line-tables-only"

# Debug-friendly profile for investigating mysteries (hangs, crashes, etc.)
# Usage: cargo build --profile mystery
[profile.mystery]
inherits = "release"
opt-level = 1
debug = true
strip = false

# Optimized profile for benchmarks
[profile.bench]
inherits = "release"
lto = "thin"
debug = "line-tables-only"
