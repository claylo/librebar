      - slug: ring-is-the-sole-c-asm-island
        title: 'The crate''s zero-unsafe guarantee stops at the crypto boundary: ring contributes 17 C files and 90 assembly files behind a build script'
        criterion: "8.1"
        surface: FFI
        concern: note
        locations:
          - path: Cargo.toml
            start_line: 64
            end_line: 66
        evidence: |
          hyper = { version = "1.9", features = ["client", "http1", "http2"], optional = true }
          hyper-rustls = { version = "0.27", features = ["http1", "http2", "ring", "webpki-tokio"], default-features = false, optional = true }
          rustls = { version = "0.23.40", default-features = false, optional = true }
        evidence_lang: toml
        evidence_markers:
          - lines: "2"
            type: mark
            label: explicit ring selection, overriding hyper-rustls's aws-lc-rs default
        mechanism: 'First-party FFI exposure is zero and verifiably so: `src/` contains no `extern "C"`, no `extern "system"`, no `unsafe` token at all, no bindgen or cc, and `libc` is not a direct dependency; `Cargo.toml:168` sets `unsafe_code = "deny"` and the crate ships no `build.rs`. Surface 8 therefore applies only transitively, and it reduces to one crate. Under `--all-features` the graph contains `ring` 0.17.14, which ships 17 `.c` files, 28 `.h` files, 90 `.S`/`.asm` files, a `build.rs` that drives a C compiler over them, and roughly 230 occurrences of `unsafe` in its Rust sources — by a wide margin the largest non-Rust surface in the tree, and code over which the crate''s own `deny(unsafe_code)` lint has no authority. It arrives solely through the TLS stack: `ring` <- `rustls` 0.23.42 <- {`hyper-rustls`, librebar directly, `tokio-rustls`}, so it is present only when the `http` feature is on and absent from a `config`-only build. Worth recording explicitly: the selection is deliberate and is the *more* conservative of the two realistic options. `hyper-rustls` 0.27 defaults to `aws-lc-rs`, and `Cargo.toml:65` sets `default-features = false` and names `ring` instead, choosing the smaller and longer-audited C surface over AWS-LC. Neither is pure Rust, and the pure-Rust rustls providers (rustls-graviola, rustls-rustcrypto) are not production-equivalent drop-ins for 0.23, so no all-Rust option was foregone. This is a documented residual, not a lapse.'
        remediation: No change recommended; record the decision rather than revisit it. Add a comment beside `Cargo.toml:65` in the same style as the base64 note at lines 80-82, stating that `ring` is chosen over the `aws-lc-rs` default as the smaller audited C surface, that both are C, and that pure-Rust providers were evaluated and rejected as not production-ready for rustls 0.23. That turns the one place where `deny(unsafe_code)` does not reach into an explicit, reviewable choice and gives a future reader the trigger for revisiting it — a pure-Rust provider reaching parity. Re-evaluate if FIPS validation ever becomes a requirement, which would force `aws-lc-rs` and change the calculus.
