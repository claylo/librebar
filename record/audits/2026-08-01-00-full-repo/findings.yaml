          enables: []
          enabled_by: []
          related: []
        effort: small
        effort_notes: Reorder the fallback chain and add an fstat ownership check after open
  - slug: supply-chain
    title: The Supply Chain Surface
    thesis: The dependency policy is codified, enforced, and unusually well-maintained; the exposure that remains is in what the policy does not cover.
    verdict: 'This surface is in better shape than most published crates and should be read that way. `.config/deny.toml` carries an explicit license allowlist that documents its own non-obvious entries, and an advisory ignore list that is empty because the one suppression it held was removed once its cause cleared — a discipline almost nobody sustains. The gaps are narrow and specific: `serde-saphyr` is pinned to an exact `0.0.x` on a default-feature path, which is the one dependency in the tree that no `cargo update` can ever reach, and `ring` is the sole C and assembly island in an otherwise all-Rust graph, which is the honest boundary of this crate''s zero-unsafe posture.'
    flow:
      - id: manifest
        label: Cargo.toml requirements
        type: start
        findings:
          - slug: serde-saphyr-exact-pin-on-default-path
            label: 0.0.x unreachable
      - id: resolve
        label: cargo resolves Cargo.lock
        type: process
        findings:
          - slug: bans-multiple-versions-warn-only
            label: Duplicates only warn
      - id: policy
        label: just deny (.config/deny.toml)
        type: process
        findings:
          - slug: advisory-suppressions-removed-after-cause-cleared
            label: Ignore list empty
          - slug: license-allowlist-stale-entries
            label: 3 stale entries
      - id: compile
        label: Compile the graph
        type: process
        findings:
          - slug: ring-is-the-sole-c-asm-island
            label: 'ring: 17 C, 90 asm'
          - slug: base64-simd-unsafe-optout-holds
            label: simd-unsafe opted out
      - id: shipped
        label: Downstream binary ships
        type: end
    findings:
      - slug: serde-saphyr-exact-pin-on-default-path
        title: serde-saphyr sits at 0.0.29, where Cargo's compatibility range is a single version, on a default-feature path
        criterion: "13.5"
        surface: Dependency Fitness
        concern: significant
        locations:
          - path: Cargo.toml
            start_line: 38
            end_line: 40
          - path: Cargo.toml
            start_line: 145
            end_line: 147
          - path: .github/dependabot.yml
            start_line: 17
            end_line: 18
          - path: Cargo.lock
            start_line: 1926
            end_line: 1929
        evidence: |
          # Feature: config
          toml = { version = "1.1", optional = true }
          serde-saphyr = { version = "0.0.29", optional = true }
        evidence_lang: toml
        evidence_markers:
          - lines: "3"
            type: mark
            label: ^0.0.29 matches only 0.0.29 — not a range
        mechanism: 'Cargo''s caret semantics treat the leading non-zero component as the compatibility unit. For a `0.0.z` version there is no non-zero component before `z`, so every `0.0.z` release is mutually incompatible and the requirement `"0.0.29"` resolves to exactly one version: 0.0.29, confirmed at `Cargo.lock:1927`. This is not a loose floor that happens to have resolved tightly — it is a hard pin that cannot move. A hypothetical 0.0.30 carrying a security fix would not be picked up by `cargo update`, by `just update` (`.justfile:61`), or by any consumer''s lockfile refresh; only a hand edit to `Cargo.toml` releases it. Two factors sharpen this. First, `serde-saphyr` sits on the `config` feature (`Cargo.toml:147`), and `config` is in `default` (`Cargo.toml:145`), so this is the YAML parser every downstream user gets unless they opt out. Second, the repo has deliberately disabled Dependabot version PRs — `open-pull-requests-limit: 0` at `.github/dependabot.yml:18`, with only security *alerts* routed to issues by the weekly workflow. That is a defensible choice for a crate that batches updates by hand, but it removes the automation that would otherwise surface the staleness, so the exact pin and the disabled updater compound. Upstream has since moved: serde-saphyr published 1.0.0 on 2026-07-31, one day before this commit, following 1.0.0-rc.1 and 1.0.0-rc.2, and it is not a fringe dependency — 3.55M total downloads, 2.76M in the last 90 days. The 1.0.0 release is a semver-major jump and is one day old, so adopting it immediately is not the recommendation; the finding is that the requirement as written cannot express "take patches," only "never move."'
        remediation: 'Decide explicitly between the two coherent postures rather than inheriting the current one by accident. If serde-saphyr 1.0.0 is to be adopted, change the requirement to `"1.0"` so ordinary patch and minor fixes flow, and treat the migration as a normal semver-major bump under the existing `just upgrade-breaking` recipe once 1.0.0 has had a few weeks of soak. If staying on the 0.0.x line for now, say so in a comment beside the pin recording that `0.0.z` is exact-by-construction and that the crate is consciously frozen pending 1.0 evaluation, and open a tracking issue — that converts an invisible constraint into a visible decision. Either way, audit the other pre-1.0 dependencies on default paths for the same property: `0.x.y` requirements such as `tracing-subscriber = "0.3"` (Cargo.toml:46) and `hyper-rustls = "0.27"` (Cargo.toml:65) behave normally for their line — minor bumps breaking, patches flowing — but any other `0.0.z` requirement is a silent hard pin.'
        temporal:
          introduced: "2026-04-08"
          last_modified: "2026-08-01"
          commit_count: 29
          monthly_commits:
