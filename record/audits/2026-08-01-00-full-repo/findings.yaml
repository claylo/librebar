            - 0
            - 0
            - 8
            - 0
            - 0
            - 0
            - 0
        chains:
          enables: []
          enabled_by:
            - blocking-fsync-on-async-cache-paths
          related:
            - ctrl-c-registration-error-triggers-shutdown
        effort: small
        effort_notes: |
          A loop, a counter, and an escalation branch inside the existing task, plus a doc paragraph. The bounded-drain API is the only part that needs design.
      - slug: ctrl-c-registration-error-triggers-shutdown
        title: A failed ctrl_c handler registration is discarded and read as a received signal
        criterion: "6"
        surface: Concurrency
        concern: moderate
        locations:
          - path: src/shutdown.rs
            start_line: 79
            end_line: 93
        evidence: |2
                  runtime.spawn(async move {
                      let ctrl_c = tokio::signal::ctrl_c();

                      #[cfg(unix)]
                      tokio::select! {
                          _ = ctrl_c => {},
                          _ = sigterm.recv() => {},
                      }

                      #[cfg(not(unix))]
                      ctrl_c.await.ok();

                      tracing::info!("shutdown signal received");
                      handle.shutdown();
                  });
        evidence_lang: rust
        evidence_markers:
          - lines: "6"
            type: del
            label: io::Result discarded — Err resolves this branch immediately
          - lines: "11"
            type: del
            label: 'same on non-unix: .ok() swallows the registration error'
          - lines: 13-14
            type: mark
            label: logs a signal that was never delivered, then shuts the app down
        mechanism: |
          `tokio::signal::ctrl_c()` is `async fn ctrl_c() -> io::Result<()>` whose body is `os_impl::ctrl_c()?.recv().await` (tokio-1.53.1 `src/signal/ctrl_c.rs:59-62`) — the `?` means a handler-registration failure returns `Err` on the very first poll, without ever waiting for a signal. Both arms here discard that value: the `select!` pattern `_ = ctrl_c => {}` binds and drops the `Result`, and the non-unix path calls `.ok()`. So if SIGINT registration fails — the documented causes are a lower-level C call failing or a previous initialization of that signal having failed, which is what a restricted seccomp/sandbox profile or a conflicting handler produces — the branch completes instantly, the task logs `"shutdown signal received"`, and `handle.shutdown()` fires milliseconds after startup. A long-running service shuts itself down at boot, and the one log line emitted names a cause that did not happen, so the operator has nothing to go on. Note the contrast with the SIGTERM path on line 73, which correctly propagates its registration failure as `Error::ShutdownInit` before anything is spawned.
        remediation: |
          Register SIGINT eagerly alongside SIGTERM, before the spawn, using `tokio::signal::unix::signal(SignalKind::interrupt())` and the same `map_err(crate::Error::ShutdownInit)?` treatment, so a registration failure surfaces synchronously from `register_signals` instead of being reinterpreted as a signal. Where a `Result` must still be awaited, match on it and log the error rather than triggering shutdown.
        temporal:
          introduced: "2026-04-08"
          last_modified: "2026-04-17"
          commit_count: 8
          monthly_commits:
