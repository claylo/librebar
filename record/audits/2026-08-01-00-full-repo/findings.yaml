        effort_notes: |
          Correcting the comment is a one-line edit. The `forbid` move is one line removed from `[lints.rust]` and one attribute changed at src/lib.rs:142, verified by `just check`.
      - slug: cargo-profiles-do-not-reach-consumers
        title: The tuned Cargo profiles affect only local development, and two of the settings restate Cargo's defaults
        criterion: "12.5"
        surface: Performance
        concern: note
        locations:
          - path: Cargo.toml
            start_line: 188
            end_line: 217
        evidence: |
          [profile.dev]
          debug = "line-tables-only"
          opt-level = 1
          # On macOS, keep debug info from exploding into huge scattered dSYM trees
          split-debuginfo = "packed"
          codegen-units = 256

          # Test profile with full debug symbols for profiling
          [profile.test]
          inherits = "dev"
          codegen-units = 256
          debug = true

          # Release profile with reduced debug info
          [profile.release]
          debug = "line-tables-only"

          # Debug-friendly profile for investigating mysteries (hangs, crashes, etc.)
          # Usage: cargo build --profile mystery
          [profile.mystery]
          inherits = "release"
          opt-level = 1
          debug = true
          strip = false

          # Optimized profile for benchmarks
          [profile.bench]
          inherits = "release"
          lto = "thin"
          debug = "line-tables-only"
        evidence_lang: toml
        evidence_markers:
          - lines: "6"
            type: mark
            label: 256 is already the dev default — no-op
          - lines: "11"
            type: mark
            label: inherits dev, which already sets 256 — no-op
          - lines: 15-16
            type: mark
            label: ignored entirely when librebar is a dependency
          - lines: 27-30
            type: mark
            label: bench profile tuned, but the repo contains no benches/ directory
        mechanism: |
          Cargo honours `[profile.*]` only from the manifest of the package being built as the workspace root. librebar is published to crates.io as a library, so for every consumer these thirty lines are inert — a downstream binary gets the stock release profile regardless of what `[profile.release]` says here. That is worth stating plainly because it reframes the block: it is local development-experience tuning, not shipped performance, and questions like "should release get thin LTO, panic=abort, or strip" are the consumer's call and cannot be answered from this manifest. Two settings are also no-ops on their own terms: `codegen-units = 256` is already Cargo's default for dev and test, so line 193 and line 198 change nothing. `[profile.dev.package."*"] opt-level = 1` (Cargo.toml:178-180) is partly redundant with `[profile.dev] opt-level = 1`, which already applies to dependencies; only its `debug = 0` is doing work. And `[profile.bench]` tunes a profile the repository never invokes, since there is no `benches/` directory.
        remediation: |
          Delete the two `codegen-units = 256` lines and the redundant `opt-level` in the `package."*"` override, keeping `debug = 0` there. Add a one-line comment at the head of the block recording that these profiles apply only when building librebar itself, so a future reader does not try to tune consumer performance from here. Keep `[profile.bench]` only if the benches from `bench-apparatus-measures-nothing` get written; otherwise drop it with the rest of that apparatus. Guidance for consumers on release tuning belongs in the README, not in a profile table they will never see.
        temporal:
          introduced: "2026-04-08"
          last_modified: "2026-08-01"
