      - slug: advisory-suppressions-removed-after-cause-cleared
        title: The advisory ignore list is empty and its history is documented — the suppression was removed once its cause cleared
        criterion: "7.5"
        surface: Supply Chain
        concern: note
        locations:
          - path: .config/deny.toml
            start_line: 42
            end_line: 51
          - path: Cargo.lock
            start_line: 187
            end_line: 191
        evidence: |
          [advisories]
          db-path = "~/.cargo/advisory-db"
          db-urls = ["https://github.com/RustSec/advisory-db"]

          # Accepted advisories.
          #
          # Empty. RUSTSEC-2025-0141 (bincode 1.3.3 unmaintained) was ignored here while
          # gungraun pinned `bincode = "1"`. gungraun 0.19.4 migrated to `bincode-next`
          # 2.x, so bincode 1.x is no longer in the graph and the suppression was removed.
          ignore = []
        evidence_lang: toml
        evidence_markers:
          - lines: "10"
            type: mark
            label: 'verified accurate: no suppressions, and none are needed'
        mechanism: 'Advisory ignore lists are the standard place where supply-chain policy quietly rots: a suppression is added under deadline pressure, the upstream cause is fixed months later, and the entry survives indefinitely because nothing forces a re-check — so a future advisory against the same crate is silently swallowed. This repo does the rare, correct thing, and the claim in the comment is verifiable rather than aspirational. Confirming it against the current tree: `Cargo.lock` contains `bincode-next` 2.1.0 and no `bincode` at any version; `gungraun` 0.19.4''s own manifest declares `dep:bincode-next` rather than `bincode`; and `gungraun` is the only path by which it enters, reachable solely through the non-default `bench-gungraun` feature. RUSTSEC-2025-0141 is therefore genuinely inapplicable, `ignore = []` is correct rather than optimistic, and `cargo audit` passes clean against all 306 lock entries. The comment also preserves the reasoning for why the entry once existed, which is what makes the removal auditable at all — a bare `ignore = []` would be indistinguishable from a policy that had never been exercised. Recording this as a finding because it is the behaviour the surrounding criteria assume and almost never observe, and because it sets the standard the two policy nits elsewhere in this file should be held to.'
        remediation: 'No action. Preserve the convention: when a suppression is added, record the upstream condition that would allow its removal in the same comment, and re-check the list whenever that dependency is bumped. The one durable improvement is to make the re-check automatic rather than remembered — with `ignore = []` there is nothing to expire today, but if a future entry is added, cargo-deny''s per-entry `expiration` field turns "we should revisit this" into a date that fails the build on its own.'
