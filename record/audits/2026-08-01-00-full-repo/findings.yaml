      - slug: ci-reimplements-justfile-recipes
        title: CI never invokes just; it reimplements each recipe as a cargo command, and the drift hazard is self-documented
        criterion: "7.1"
        surface: Supply Chain
        concern: note
        locations:
          - path: .github/workflows/ci.yml
            start_line: 82
            end_line: 92
          - path: .justfile
            start_line: 26
            end_line: 27
          - path: .justfile
            start_line: 48
            end_line: 48
        evidence: |
          # The action composes `cargo-deny <arguments> <command> <command-arguments>`.
          #
          # `--config` position is cargo-deny-version-specific and the two forms are
          # mutually exclusive: <=0.19.x accepts it ONLY after the subcommand, 0.20+
          # ONLY before it. So the action release matters — v2.1.1 is the first that
          # bundles cargo-deny 0.20.2, matching the version `just deny` runs locally.
          # Keep this pin and .justfile's `deny` recipe in step; if they drift apart,
          # one of the two starts failing on the `--config` placement.
          #
          # `arguments` defaults to `--all-features`, restated here because setting
          # it overrides the default.
        evidence_lang: yaml
        evidence_markers:
          - lines: 7-8
            type: mark
            label: manual synchronisation between CI and .justfile, acknowledged in-line
        mechanism: 'The policy is enforced — this is worth stating plainly, because the opposite would be the serious finding. `.justfile:48` defines `check: fmt clippy deny test doc-test`, and CI covers all five: `cargo fmt --check` (line 39), clippy (42), cargo-deny via the Embark action (94), nextest (69) and doctests (72). Coverage parity is real. What is absent is a shared definition. CI never invokes `just`; the sole occurrence of the word in the workflows is inside a comment. Each step is transcribed by hand, so the two descriptions of "what checking this project means" must be kept in agreement by memory. The cargo-deny step shows the cost already being paid: it needs an 11-line comment explaining that `--config` placement moved between cargo-deny 0.19 and 0.20, that the action pin therefore determines flag order, and that the pin and `.justfile`''s recipe must stay in step. That comment exists because the drift already happened once — `ci: fix cargo-deny invocation, bump all action pins (#23)` on 2026-07-25 — and it documents a hazard rather than removing it. The exposure is bounded and the current state is correct; the point is that correctness here rests on a contributor reading a comment, and the divergence would be silent, appearing as CI checking something subtly different from what `just check` checks locally.'
        remediation: 'Make `.justfile` the single definition and have CI call it, installing `just` through the existing `setup-cargo-tools` composite action and replacing each `run:` with `just clippy`, `just deny`, `just test-ci`, `just doc-test`. Then the flag-placement comment describes one invocation instead of coordinating two, and it can be trimmed. The cargo-deny step is the one place to weigh a tradeoff rather than convert reflexively: the Embark action pins its own cargo-deny binary by SHA, which is a genuine supply-chain benefit that `just deny` (resolving whatever version is installed) does not provide. Keeping the action for that reason is defensible — in which case pin the cargo-deny version in `.justfile` too, so local and CI agree by construction rather than by comment. Either resolution is better than the present split; leaving it as-is is the only option that keeps paying the synchronisation cost.'
        temporal:
