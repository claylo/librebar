      - slug: bans-multiple-versions-warn-only
        title: The duplicate-version check warns rather than fails, and CI is the only place the warnings appear
        criterion: "13.7"
        surface: Dependency Fitness
        concern: advisory
        locations:
          - path: .config/deny.toml
            start_line: 57
            end_line: 62
          - path: .config/deny.toml
            start_line: 68
            end_line: 74
        evidence: |
          [bans]
          multiple-versions = "warn"
          wildcards = "allow"
          highlight = "all"
          deny = []
          skip = []
        evidence_lang: toml
        evidence_markers:
          - lines: "2"
            type: mark
            label: warn never fails CI; duplicates accrue silently
          - lines: "6"
            type: mark
            label: empty skip list means accepted duplicates are recorded nowhere
        mechanism: '`cargo tree -d --all-features` prints nine headings, of which four are crates genuinely resolved at more than one version — five extra copies in total: `syn` at 2.0.119 and 3.0.3, `getrandom` at 0.2.17, 0.3.4 and 0.4.3, `base64` at 0.22.1 and 0.23.0, and `supports-color` at 2.1.0 and 3.0.2. The other five headings (derive_more, memchr, serde, serde_core, serde_json) are same-version entries split by feature or proc-macro resolution, not duplicates. `Cargo.lock` holds 306 package entries against 299 unique crate names, so seven entries are duplicate versions — the two not in the list above are `r-efi` and `windows-sys`, both target-gated and therefore invisible to `cargo tree -d` on this host. The `syn` split is the expensive one — it is the single largest compile-time cost in most Rust builds and both majors are compiled, 2.0.119 for tokio-macros / tracing-attributes / wasm-bindgen and 3.0.3 for clap_derive / serde_derive / thiserror-impl. `supports-color` is the one librebar cannot fix at all: both versions arrive through the same crate. owo-colors 4.3.0 defines `supports-colors = ["dep:supports-color-2", "supports-color"]` (owo-colors-4.3.0/Cargo.toml:58-61) and declares `supports-color` at 3.0.0 alongside `supports-color-2`, a rename of the 2.0 line (lines 67-74); librebar enables exactly that feature at `Cargo.toml:36`. The duplicate is upstream''s deliberate choice, so no resolution or bump on librebar''s side unifies it. The delivery problem compounds the policy one. With `multiple-versions = "warn"` cargo-deny prints these and exits 0, and the only place they are printed is the cargo-deny CI job, whose green checkmark is what anyone actually looks at. Warnings that appear exclusively in the log of a passing job are not read; the `.crustoleum/deny.txt` capture is itself evidence of this, since the duplicate warnings were present there and had to be surfaced by an audit rather than by the pipeline. The setting is a defensible starting posture — a foundation library does not control its transitive graph and cannot unilaterally resolve a `syn` major split — but as written it provides no ratchet, so nothing distinguishes "duplicates we accepted" from "duplicates we just acquired." `[sources] unknown-registry = "warn"` has the same shape: every one of the 306 lock entries currently resolves to crates.io, so denying costs nothing today.'
        remediation: 'Convert the check into a ratchet: set `multiple-versions = "deny"` and enumerate the currently-accepted duplicates in `skip`, each with a comment naming the crate that forces it and the condition for removing the entry. `syn` 2.0.119 is held by darling_core, derive_more-impl, divan-macros, futures-macro, gungraun-macros, pin-project-internal, prost-derive, rmcp-macros, schemars_derive, serde_derive_internals, synstructure, tokio-macros, tracing-attributes and the zerovec/yoke/zerofrom derive family — clap_derive, serde_derive and thiserror-impl are already on 3.0.3, so the condition is those fourteen moving, not the ones that have. `getrandom` 0.2.17 is held by `ring` and 0.4.3 by the `tempfile` dev-dependency. `supports-color` belongs in `skip` too, with the note that owo-colors depends on both majors deliberately and the only levers are dropping the `supports-colors` feature at `Cargo.toml:36` or an upstream owo-colors change. New duplicates then fail CI and must be either fixed or consciously accepted, while the existing ones stay green. `cargo deny check bans` prints the exact `skip` stanzas to paste. This also gives the duplicates a written rationale, matching the standard the rest of this file already sets. Flip `[sources] unknown-registry` to `"deny"` at the same time — it is free today and turns a silent warning into a real gate on the first non-crates.io dependency.'
