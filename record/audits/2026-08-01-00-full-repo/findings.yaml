          "BSL-1.0",      # Boost Software License
          "ISC",
          "MIT",
          "MIT-0",        # MIT No Attribution
          "MPL-2.0",      # Mozilla Public License (weak copyleft, permissive for linking)
          "Zlib",

          # Public domain dedications
          "0BSD",         # Zero-Clause BSD
          "CC0-1.0",      # Creative Commons Zero
          "Unlicense",
        evidence_lang: toml
        evidence_markers:
          - lines: "1"
            type: mark
            label: no crate in the graph uses BSL-1.0
          - lines: "4"
            type: mark
            label: no crate in the graph uses MIT-0
          - lines: "10"
            type: mark
            label: no crate in the graph uses CC0-1.0
        mechanism: 'Enumerating every `license` field across the full `--all-features` graph and matching it against the 15-entry allowlist shows that 12 entries are load- bearing and 3 match nothing: BSL-1.0, MIT-0 and CC0-1.0. Because `unused-allowed-license = "allow"` (line 36) suppresses cargo-deny''s stale-entry reporting, this will never surface on its own. The practical effect is small — all three are permissive, and none is a license anyone would be alarmed to find — but they function as standing pre-authorizations: a future dependency arriving under CC0-1.0 or BSL-1.0 is admitted with no review event, which is precisely what an allowlist exists to prevent. Every other entry is genuinely needed, including the ones that look exotic: Unicode-3.0 covers 18 crates, CDLA-Permissive-2.0 covers exactly the one crate its comment names, and MPL-2.0 covers one. Two details are worth recording. First, `confidence-threshold = 0.8` (line 35) is currently inert: it governs only text-similarity scoring for crates that ship a `license-file` instead of a `license` field, and zero of the graph''s crates do that, so the value has no effect on this dependency set. It is also cargo-deny''s default, so it is not a loosening — it is simply dormant until some future dependency omits a machine-readable license. Second, one crate''s license expression is malformed: `bincode-next` 2.1.0 declares `MIT or Apache-2.0` with a lowercase operator, which is not valid SPDX. cargo-deny''s lax parse mode accepts it silently and resolves it correctly to MIT OR Apache-2.0, so there is no compliance exposure, but the tolerance is the tool''s rather than the policy''s.'
        remediation: 'Drop BSL-1.0, MIT-0 and CC0-1.0 unless they are deliberate forward-looking allowances, in which case add a one-line comment saying so — the file already does exactly this for CDLA-Permissive-2.0, and that comment is the model to follow. Then set `unused-allowed-license = "warn"` so the list stays honest as the graph moves; with the stale entries removed first, that flip is quiet rather than noisy. Leave `confidence-threshold` at 0.8: it is the tool default and appropriate, and the fact that it is currently unreachable is a property of the graph, not a misconfiguration. The `bincode-next` SPDX typo is worth a one-line upstream PR, since it costs nothing and every downstream cargo-deny user is relying on lax parsing for it.'
