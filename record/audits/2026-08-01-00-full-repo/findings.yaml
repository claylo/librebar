          A `prune()` method plus a size/count policy and its call sites. Needs new tests in `tests/cache_test.rs` for expiry sweeps and ceiling enforcement.
      - slug: cache-set-fsync-per-write
        title: Every cache write pays a full-drive fsync (~5 ms measured) for data the code already treats as disposable
        criterion: "12.5"
        surface: Performance
        concern: moderate
        locations:
          - path: src/cache.rs
            start_line: 178
            end_line: 190
          - path: src/http/cookies.rs
            start_line: 70
            end_line: 73
        evidence: |
          fn write_entry(path: &Path, bytes: &[u8]) -> std::io::Result<()> {
              let mut options = AtomicWriteFile::options();
              #[cfg(unix)]
              {
                  use atomic_write_file::unix::OpenOptionsExt as _;
                  use std::os::unix::fs::OpenOptionsExt as _;
                  options.mode(0o600).preserve_mode(false);
              }
              let mut file = options.open(path)?;
              file.write_all(bytes)?;
              file.sync_all()?;
              file.commit()
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "11"
            type: mark
            label: explicit fsync; on macOS std maps sync_all to fcntl(F_FULLFSYNC), a full drive barrier
          - lines: "12"
            type: mark
            label: AtomicWriteFile::commit() calls sync_all() again internally before renaming
        mechanism: |
          `Cache::set` is the single write path for the `cache`, `http-cache`, and `update` features. It ends in an fsync, and then `AtomicWriteFile::commit()` performs a second one — commit's implementation is `self.sync_all()?; self.temporary_file.rename_file()` (atomic-write-file 0.3.0 lib.rs:611-618), so the explicit call at line 188 is redundant. Measured on this machine (APFS, 4 KiB payloads, 20 iterations): plain write, no sync = 60 µs/write; write + sync_all = 5.08 ms/write; write + rename with no fsync = 115 µs/write. That is ~44x, or ~5 ms of wall clock added to every `get_cached` miss, every 304 revalidation that refreshes an entry, and every `UpdateChecker::check` that stores a version — the last of which sits directly on CLI startup. The durability being bought is not needed: this is a cache, and the read path already handles torn or corrupt entries gracefully by discarding them (src/http/cache.rs:383-392 and 411-418 both log and delete). The code pays 5 ms per write to avoid a failure mode it explicitly recovers from. `CookieJar::save_to` has the same doubled fsync at src/http/cookies.rs:70-73.
        remediation: |
          Drop the explicit `file.sync_all()` at line 188 and at src/http/cookies.rs:70 — it is strictly redundant with `commit()`. For the remaining fsync, note that atomic-write-file 0.3.0 exposes no way to skip it (`OpenOptions` offers only `read` plus the unix `mode`/`preserve_mode` extensions), so removing it means writing to a temp file in the same directory and calling `std::fs::rename` directly. Rename is already atomic within a filesystem, which is the only property a cache needs; keep the 0600 mode via `OpenOptions::mode`. If durability is wanted for cookies specifically (a credential store, unlike a cache), keep the sync there and drop it only in `Cache`.
