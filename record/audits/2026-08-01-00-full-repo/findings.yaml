  - slug: http-cache
    title: The HTTP Cache Surface
    thesis: 'The cache is correct about freshness and careless about everything else it writes to disk: what the bytes cost, who can read them, and when they are removed.'
    verdict: 'Two independent agents reached this code from different directions and found the same defect, which is the strongest corroboration in the audit. The body amplification is measurable and large — two serialization layers stacked on binary data, 4.6x on disk and roughly 10 ms of CPU per MiB retrieved. The credential-header persistence is the one to fix first, though: it is smaller, quieter, and writes authentication material to disk that the cache-key fingerprint does not account for. Eviction is the structural gap — nothing prunes the cache except a repeat read of the same key, so a cache of one-shot keys grows without bound and is never revisited.'
    flow:
      - id: request
        label: Request issued
        type: start
      - id: key
        label: Build cache key
        type: process
        findings:
          - slug: http-cache-persists-unrecognized-credential-headers
            label: Creds outside key
      - id: fresh
        label: Entry fresh?
        type: decision
        no: fetch
      - id: decode
        label: base64 -> JSON -> bytes
        type: process
        findings:
          - slug: http-cache-entry-body-amplification
            label: 4.6x decode tax
      - id: serve
        label: Response returned
        type: end
      - id: fetch
        label: Fetch from origin, then store
        type: store
        spine: false
        findings:
          - slug: cache-set-fsync-per-write
            label: fsync every write
          - slug: blocking-fsync-on-async-cache-paths
            label: Blocks the runtime
          - slug: cache-has-no-eviction-outside-per-key-reads
            label: Never pruned
        next: serve
    findings:
      - slug: http-cache-entry-body-amplification
        title: Cached HTTP bodies are written through two serialization layers, inflating them 4.6x and costing 10 ms of CPU per 1 MiB cache hit
        criterion: "12.5"
        surface: Performance
        concern: significant
        locations:
          - path: src/http/cache.rs
            start_line: 561
            end_line: 584
          - path: src/http/cache.rs
            start_line: 75
            end_line: 82
          - path: src/cache.rs
            start_line: 79
            end_line: 86
          - path: src/cache.rs
            start_line: 42
            end_line: 49
        evidence: |2
              let entry = CachedHttpEntry {
                  format_version: 1,
                  policy: policy.clone(),
                  response: CachedResponse {
                      status: response.status,
                      version: response.version,
                      headers: response.headers.clone(),
                      trailers: response.trailers.clone(),
                      body: response.body.clone(),
                  },
              };
              let encoded = match serde_json::to_vec(&entry) {
                  Ok(encoded) => encoded,
                  Err(error) => {
                      tracing::warn!(key, error = %error, "failed to serialize HTTP cache entry");
                      return;
                  }
              };
              let ttl = policy
                  .time_to_live(now)
                  .saturating_add(client.config().http_cache_stale_retention);
              if let Err(error) = cache.set(&namespaced_key(key), &encoded, ttl) {
                  tracing::warn!(key, error = %error, "failed to persist HTTP cache entry");
              }
        evidence_lang: rust
        evidence_markers:
          - lines: "9"
            type: mark
            label: full copy of the body before any encoding
          - lines: "12"
            type: mark
            label: CachedResponse.body is Vec<u8>; serde_json emits it as a JSON array of decimal integers (3.45x)
          - lines: "22"
            type: mark
            label: Cache::set then base64-encodes that blob and re-serializes it into a second JSON document (4.60x total)
        mechanism: |
          `CachedResponse.body` is a plain `Vec<u8>` (src/http/cache.rs:81). serde has no bytes-transparent representation for `Vec<u8>`, so `serde_json::to_vec` at line 572 renders every byte as a decimal integer inside a JSON array. That blob is then handed to `Cache::set`, which base64-encodes it (src/cache.rs:81) and serializes the result into a *second* JSON document whose `value` field is that base64 string (src/cache.rs:42-49, 85). The read path runs the same chain in reverse: read file → parse outer JSON allocating the full base64 String → base64-decode → parse the inner JSON array integer by integer. I measured the exact pipeline against a 1 MiB JSON-API-shaped body on this machine (M3 Pro, release build): the on-disk entry is 4,821,095 bytes (4.60x), the write path costs 6.76 ms, and the read path — which is the *cache hit*, the operation whose entire purpose is to beat the network — costs 10.3 ms of pure CPU against a 21.5 µs memcpy baseline. On a LAN origin or a warm CDN edge, a cache hit is now slower than the request it replaced. The `body.clone()` at line 569 adds one more full copy on top, and it is unconditional: `persist_entry` already built a `CachedResponse` by cloning the body once (src/http/cache.rs:93), so a stored response is copied twice before encoding begins.
        remediation: |
          Stop routing binary bodies through JSON twice. The narrow fix is to give `CachedResponse.body` a bytes-aware serde representation (serde_bytes, or a manual `serialize_bytes`/`deserialize_bytes` impl) so the inner document stops emitting a decimal-integer array — that alone removes the 3.45x. The complete fix is to give `Cache` a bytes-native store: keep the JSON header for `expires_at` but write the payload as raw bytes after a length prefix or separator, so `Cache::set`/`get` never base64 anything. Base64 buys nothing here — the file is opaque, binary-safe, and already mode 0600. If the JSON envelope must stay for format stability, bump `format_version` and migrate. Finally, remove the second `body.clone()` at line 569 by having `persist_cached_response` take the `CachedResponse` by value. This needs the revalidation path reordered first: at src/http/cache.rs:484-485 `cached` is passed to the persist call and then moved into `fresh_response` on the next line, so a by-value signature fails to compile there (E0382). Either reorder those two statements or have the function hand the value back. The other call site (src/http/cache.rs:548) is already fine.
        temporal:
          introduced: "2026-08-01"
          last_modified: "2026-08-01"
          commit_count: 1
          monthly_commits:
