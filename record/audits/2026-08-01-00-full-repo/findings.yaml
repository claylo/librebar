      - slug: ci-builds-only-all-features
        title: Every CI job builds --all-features; no job builds the default set or any individual feature
        criterion: "7.3"
        surface: Supply Chain
        concern: significant
        locations:
          - path: .github/workflows/ci.yml
            start_line: 68
            end_line: 72
          - path: .github/workflows/ci.yml
            start_line: 41
            end_line: 42
          - path: .github/workflows/ci.yml
            start_line: 154
            end_line: 158
          - path: Cargo.toml
            start_line: 144
            end_line: 148
        evidence: |
          - name: nextest
            run: cargo nextest run --workspace --all-features --profile ci

          - name: doctests
            run: cargo test --doc --all-features
        evidence_lang: yaml
        evidence_markers:
          - lines: "2"
            type: mark
            label: the only feature combination CI ever compiles
          - lines: "5"
            type: mark
        mechanism: 'librebar declares 19 features gating roughly 37 optional dependencies, and its entire value proposition is that a downstream consumer selects a narrow subset. CI compiles exactly one point in that space. All five feature-bearing steps — clippy (line 42), nextest (line 69), doctests (line 72), cargo-deny (line 97) and the MSRV check (line 158) — pass `--all-features`. Nothing builds the default set, nothing builds `--no-default-features`, and nothing builds a single feature in isolation. `--all-features` is the single weakest configuration for catching feature-gating bugs, because with every feature on, every `#[cfg(feature = ...)]` arm is live and every optional dependency is in scope; a missing `dep:` edge, a `use` statement behind the wrong gate, or a function referenced from a module its own feature does not enable are all invisible. Feature unification hides the same class of bug in reverse: a module that only compiles because some *other* feature happened to pull its dependency in will build green forever under `--all-features` and fail the moment a user picks it alone. The gap is measurable rather than theoretical — the recon pass had to generate `.crustoleum/feature-matrix.txt` locally to learn that all 18 named features compile in isolation. That result is real (18/18 PASS) but it is a one-off developer artifact at one commit, not a gate; nothing prevents the next commit from breaking it, and the breakage surfaces as a downstream user''s build error against a published crate.'
        remediation: Add a feature-matrix job to `ci.yml` that runs `cargo check --no-default-features --features <F>` for each of the 19 features plus a bare `--no-default-features` and a default-features build. `cargo-hack` does this in one line (`cargo hack check --each-feature --no-dev-deps`) and is the ecosystem-standard tool; `--feature-powerset --depth 2` additionally catches pairwise interactions if build minutes allow. The existing `.github/actions/setup-cargo-tools` composite action already installs cargo tooling via binstall, so the new job reuses the established pattern. Keep the `--all-features` jobs — that is the right configuration for clippy and the test suite — and add the matrix alongside rather than in place of them. Adding a matching `just feature-matrix` recipe keeps the local and CI stories aligned with the project's existing convention.
