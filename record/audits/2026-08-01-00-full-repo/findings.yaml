      - slug: no-attested-publish-path
        title: crates.io publishing is fully manual — no automated workflow, no Trusted Publishing, no attestation
        criterion: "7.1"
        surface: Supply Chain
        concern: moderate
        locations:
          - path: .config/scrat.toml
            start_line: 1
            end_line: 8
          - path: SECURITY.md
            start_line: 44
            end_line: 49
        evidence: |
          [project]
          type = "rust"

          [commands]
          test = "just test"

          [ship]
          no_publish = true
        evidence_lang: toml
        evidence_markers:
          - lines: 7-8
            type: mark
            label: release tooling explicitly does not publish; nothing else does either
        mechanism: 'librebar is published to crates.io as infrastructure — its own SECURITY.md names "Official distribution channels (crates.io, GitHub releases)" as in scope, and every downstream binary inherits whatever is uploaded. Yet no automation performs that upload. Grepping `.github/` for `cargo publish`, `CARGO_REGISTRY_TOKEN`, `id-token` and trusted-publishing markers returns nothing; the three workflows are CI, a Dependabot-alerts-to-issues job, and a PR-title linter; and the release tool''s own config sets `no_publish = true`. Publication therefore happens from a developer workstation using a long-lived crates.io API token in `~/.cargo/credentials.toml`. That token is a standing bearer credential with no expiry and no scope beyond the crates it owns: anything that can read the developer''s home directory — a malicious build script from any of the 30 dependencies that ship one, a compromised editor extension, a stolen laptop — can publish a librebar version that every downstream `cargo update` accepts. There is also no provenance record tying a published .crate file to the commit it was built from, so a malicious upload is not detectable by inspection after the fact. The rest of this repo''s supply-chain posture is notably careful by comparison — all GitHub Actions are SHA-pinned (`ci.yml:24`, `:27`, `:94`), workflow permissions default to `contents: read`, `pull_request_target` is deliberately locked down with an explanatory comment, cargo-deny gates every PR, and the advisory policy is actively curated — which makes the publish step the weakest link in an otherwise well-defended chain.'
        remediation: 'Adopt crates.io Trusted Publishing, the direct analogue of the OIDC flows already standard on PyPI and npm, which needs no stored secret. Register the repository and a `publish` workflow name in the crate''s crates.io settings, then add a tag-triggered workflow granting `id-token: write` that exchanges the GitHub OIDC token for a short-lived (30-minute) crates.io token and runs `cargo publish`. Revoke the existing long-lived token once the flow is proven. Two additions make the result auditable rather than merely safer: gate the publish job on the existing CI jobs so nothing ships that has not passed cargo-deny, and emit build provenance with `actions/attest-build-provenance` so a published artifact traces to a commit. If manual publishing must be retained for release-timing control, keep `no_publish = true` but move the token to a hardware-backed store and document the trust assumption in SECURITY.md.'
        chains:
          enables: []
          enabled_by: []
          related: []
        effort: medium
        effort_notes: New workflow plus a one-time crates.io settings change; the SHA-pinning conventions to follow are already established in ci.yml.
