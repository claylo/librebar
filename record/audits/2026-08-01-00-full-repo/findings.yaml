        effort_notes: |
          Writing benches for four hot paths is a contained afternoon; wiring them into CI with a regression threshold is the part that takes judgment.
      - slug: unsafe-escape-hatch-rationale-does-not-match-use
        title: Crate-wide unsafe_code escape hatch is justified by benchmark harnesses that do not exist
        criterion: "1.6"
        surface: Unsafe Code
        concern: advisory
        locations:
          - path: Cargo.toml
            start_line: 165
            end_line: 168
        evidence: |
          [lints.rust]
          # Use "deny" instead of "forbid" to allow benchmark harnesses to override
          # when their instrumentation machinery requires it
          unsafe_code = "deny"
        evidence_lang: toml
        evidence_markers:
          - lines: 2-3
            type: mark
            label: Rationale names a consumer that does not exist in this repo
          - lines: "4"
            type: mark
            label: deny, not forbid — overridable by any target
        mechanism: |
          The crate deliberately chooses `deny` over `forbid` for `unsafe_code`, and the comment records the reason as benchmark instrumentation. That justification does not hold: the repository contains no `benches/` directory, no `[[bench]]` target in Cargo.toml, and `src/bench.rs` (the only file behind the `bench` and `bench-gungraun` features) contains no `unsafe` and no `#[allow(unsafe_code)]`. The escape hatch is real and is exercised, but by two integration test files for an unrelated reason — `tests/otel_test.rs:1` and `tests/update_test.rs:1` both carry `#![allow(missing_docs, unsafe_code)]` so they can call `std::env::set_var`/`remove_var`, which became `unsafe` fns in Rust 2024. Those two uses are themselves sound: each file serializes env mutation behind a file-local `ENV_LOCK: Mutex<()>`, each `unsafe` block carries an accurate `// SAFETY:` comment, the blocks are minimally scoped, and the project's own runner (`cargo nextest run`, per `.justfile:30`) gives each test its own process. The defect is documentary, not behavioural: an auditor reading Cargo.toml is pointed at benchmark code to explain why the crate's headline memory-safety guarantee is weakened, finds nothing there, and has no pointer to the two files that actually hold the override. A stale rationale on a lint that gates the crate's strongest safety claim erodes the value of that claim.
        remediation: |
          Update the comment to name the real consumer — env-var mutation in integration tests under Rust 2024 — and reference `tests/otel_test.rs` and `tests/update_test.rs` explicitly. Better still, close the hatch for library code — but not through `[lints]`. That table is package-wide and applies to every target including integration tests, and Cargo has no per-target lints table to scope around it, so setting `unsafe_code = "forbid"` there would make the `#![allow(missing_docs, unsafe_code)]` at tests/otel_test.rs:1 and tests/update_test.rs:1 a hard error and break both tests — precisely the situation `deny` was chosen to avoid. The implementable form of the same intent is to drop `unsafe_code` from `[lints.rust]` entirely and change src/lib.rs:142 from `#![deny(unsafe_code)]` to `#![forbid(unsafe_code)]`, which binds the library target only and leaves the two test targets free. If the benchmark rationale is meant to be forward-looking, say so, or drop it until a bench target actually needs it.
        temporal:
          introduced: "2026-04-08"
          last_modified: "2026-04-08"
          commit_count: 29
