      - slug: base64-simd-unsafe-optout-holds
        title: The base64 simd-unsafe opt-out is verified sound under --all-features, but a second base64 major is in the tree regardless
        criterion: "13.8"
        surface: Dependency Fitness
        concern: note
        locations:
          - path: Cargo.toml
            start_line: 79
            end_line: 83
        evidence: |
          # Feature: cache
          # default-features = false to opt out of `simd-unsafe`, which base64 0.23
          # added to its default feature set. `std` re-enables `alloc`; the cache module
          # only needs STANDARD encode/decode, which the safe implementation provides.
          base64 = { version = "0.23", default-features = false, features = ["std"], optional = true }
        evidence_lang: toml
        evidence_markers:
          - lines: "5"
            type: mark
            label: 'opt-out confirmed effective: resolved features are {std, alloc} only'
        mechanism: 'Cargo unifies features additively across a dependency graph, so a `default-features = false` opt-out is only as good as the rest of the tree — if any other crate depended on base64 0.23 with defaults on, `simd-unsafe` would be re-enabled for everyone and the stated intent silently defeated. That failure mode does not occur here. `cargo tree --all-features -e features -i base64@0.23.0` resolves exactly two features, `std` and its implied `alloc`, and `cargo tree -i` confirms librebar is the sole reverse dependency of 0.23.0. The opt-out is genuinely effective under the broadest possible feature set, which is the interesting result and the one worth recording, since it is not the default outcome and cannot be assumed. The same prefer-safe-backend discipline holds everywhere else it is selectable: `flate2` resolves through `rust_backend` -> `miniz_oxide` with no zlib-sys or C anywhere in the graph, and `tar` 0.4.46 contains zero C files. The residual note is that `base64` 0.22.1 is nonetheless present alongside 0.23.0, pulled by `rmcp`, `serde-saphyr` and `tonic`. That copy carries no safety implication — `simd-unsafe` did not exist before 0.23 — but it is a second full copy of the crate compiled and linked, and it is one of the five duplicates that the current `multiple-versions = "warn"` setting will never surface as a failure.'
        remediation: Nothing to fix in the opt-out itself; it is correct and now verified. Two things preserve that state. First, the invariant rests on librebar being the only consumer of base64 0.23, which a future dependency could break with no visible change to this line — extend the existing comment to note that the opt-out depends on no other crate enabling base64's defaults, so a reader knows what to re-check after a dependency bump. Second, fold the 0.22/0.23 split into the duplicate ratchet described in the bans finding, so the second copy is either resolved when rmcp and serde-saphyr move to 0.23 or recorded as consciously accepted.
