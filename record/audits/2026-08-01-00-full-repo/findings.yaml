audit_date: "2026-08-01"
scope: Full repository audit at 8fd83b3 — all 19 cargo features, 24 src modules, 19 integration test files, 9 examples
commit: 8fd83b359f9ae1da605a77f0e3a5fb38eb4611a7
assessment: |
  librebar 0.3.0 is a single-crate Rust 2024 application foundation for CLIs and
  services — 7,195 lines across 24 modules, gated behind 19 cargo features of which
  six are default. Its mechanical hygiene is excellent and genuinely enforced: clippy
  with `all` plus `nursery` passes clean under `--all-targets --all-features -D
  warnings`, `cargo audit` and `cargo deny` are clean against a codified policy in
  `.config/deny.toml`, there is no unsafe code in first-party source, and all eighteen
  named features compile in isolation. That baseline is what makes the findings below
  meaningful: they are the things no linter can express.

  The dominant finding is not a code defect. Every capability the README documents is
  implemented at HEAD, and almost none of it is published. `librebar = "0.3"` resolves
  to a crates.io artifact whose feature table has no `default` key at all, so the
  README's own headline example does not compile against the version it instructs
  readers to install. Three further findings explain how that went unseen — every CI
  job builds `--all-features`, so none has ever compiled the default set a consumer
  gets; docs.rs publishes only those same defaults, hiding 12 features' worth of API;
  and the README's 16 Rust blocks are compiled by nothing.

  The second theme is controls that are compiled in and then left unarmed. The cookie
  jar builds `cookie_store` with its `public_suffix` feature and never installs the
  list, paying for supercookie protection it does not receive. The redirect follower
  strips a three-name header blocklist rather than dropping credentials on cross-origin
  hops, and permits an HTTPS-to-HTTP downgrade. Two cargo features, two optional
  dependencies, and two test files exist for benchmarking and none of them benchmarks
  librebar — which is also the stated reason the crate-wide `unsafe_code` lint is set
  to `deny` rather than `forbid`.

  The third theme is outbound disclosure. The doctor bundle and the crash handler both
  produce artifacts whose purpose is to be handed to strangers; neither redacts
  anything, and both are written world-readable.

  Two things are worth stating plainly because they are solid. Certificate verification
  is never disabled anywhere in this crate, and the TLS configuration is otherwise
  tight. And the error architecture contains no panic reachable from external input and
  no unwrap on untrusted data — for a library other people's binaries link against,
  that is the outcome that matters most.
narratives:
  - slug: release-boundary
    title: The Release Boundary Surface
    thesis: 'The delivery pipeline has three gaps that will shape 0.4.0 exactly as they shaped 0.3.0: CI never builds the feature set consumers actually get, docs.rs will publish only that same set, and nothing automated reads README.md.'
    verdict: 'Fix the docs.rs metadata before 0.4.0 ships. It is four lines of manifest, it is invisible to every local check because `just check` passes without it, and it decides what every reader of the published documentation is able to see — currently the six default features and nothing else. The CI gap is the structural one: every job builds `--all-features`, so no pipeline has ever compiled the default set a stock consumer gets. That the per-feature matrix passes 18/18 today is a fact about this commit, not a property the pipeline enforces. The remaining items are small and none of them block a release.'
