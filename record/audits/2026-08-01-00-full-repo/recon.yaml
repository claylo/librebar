boundaries:
  - name: network_ingress
    description: >-
      Bytes arriving from remote hosts over the hyper/rustls client stack, then
      decompressed, parsed, cached, and handed to the caller. Everything past the
      TLS terminator is attacker-influenced if the remote is hostile or MITM'd.
    modules:
      - src/http.rs
      - src/http/response.rs
      - src/http/cache.rs
      - src/http/cookies.rs
      - src/update.rs
    notes: >-
      Gated behind the `http` family of features, none of which are in `default`.
      Reachable in the default build only if a downstream crate opts in.
  - name: local_filesystem_state
    description: >-
      Config discovery, on-disk cache, cookie jar, and lockfile. These are read at
      startup and written during operation; several hold credential-adjacent data.
    modules:
      - src/config.rs
      - src/config/environment.rs
      - src/cache.rs
      - src/lockfile.rs
      - src/http/cookies.rs
    notes: >-
      `config` and `cache` are DEFAULT features, so this boundary is live in every
      stock build.
  - name: subprocess_execution
    description: >-
      Git-style plugin dispatch: resolve a `<prog>-<subcommand>` binary on PATH and
      exec it, inheriting the parent environment.
    modules:
      - src/dispatch.rs
    notes: PATH resolution via the `which` crate. Gated behind `dispatch` (not default).
  - name: diagnostic_export
    description: >-
      The doctor bundle sweeps local config, logs, and environment into a tar.gz that
      users are expected to attach to public bug reports. Data flows outward.
    modules:
      - src/diagnostics.rs
    notes: >-
      `diagnostics` IS a default feature. Outbound-disclosure boundary, not an
      inbound-attack one.
  - name: process_lifecycle
    description: >-
      Panic hook installation, signal handling, and the flush-on-exit ordering
      contract between the logging writer, the OTLP exporter, and shutdown.
    modules:
      - src/crash.rs
      - src/shutdown.rs
      - src/logging.rs
      - src/otel.rs
    notes: >-
      `crash` and `logging` are default features; the panic hook is installed in
      every stock build and runs on arbitrary threads.

