          describing `Config.log_level` as the baseline used when `-q`/`-v` is absent,
          although no builder path reads it.
        remediation: |
          Derive logging settings from the loaded config before subsystem initialization:
          populate the baseline filter from top-level `log_level` and the configured
          directory from top-level `log_dir`, while preserving CLI, environment, and
