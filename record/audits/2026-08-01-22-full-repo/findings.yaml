            start_line: 31
            end_line: 35
        evidence: |
          ## Builder API

          The builder wires everything in the correct initialization order:

          1. Load config (if requested)
          2. Initialize logging (reads log settings from config if available)
          3. Return `App<C>` with everything wired up
        evidence_lang: markdown
        evidence_markers:
          - lines: "6"
            type: del
            label: "Promised config-to-logging integration is absent"
        mechanism: |
          `ConfiguredBuilder::start` loads the typed config into a local value, then
          calls `inner.init_subsystems()` without passing or inspecting that config.
          Logging is consequently built only from `BuilderInner::log_dir`, which stays
          unset unless `with_log_dir` was called explicitly, and `env_filter` receives
