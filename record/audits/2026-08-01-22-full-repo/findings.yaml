  - slug: signal-lifecycle
    title: "The Signal Lifecycle Surface"
    thesis: "Permanent process-wide signal handling is intentional, but repeated registration creates independent loops whose escalation state can disagree."
    verdict: "The first graceful-shutdown path is sound and intentionally process-wide. The defect is duplicate registration: process-global signal ownership needs one process-global dispatcher and one escalation state."
    flow:
      - id: register
        label: "Register signals"
        type: start
      - id: spawn
        label: "Spawn detached loop"
        type: process
        findings:
          - slug: detached-signal-task-outlives-app-lifecycle
            label: "Detached state"
      - id: app-drop
        label: "Register again?"
        type: decision
        no: await-signal
      - id: stale-task
        label: "Old task remains active"
        type: process
      - id: reregister
        label: "Register new App"
        type: process
      - id: await-signal
        label: "Receive signal"
        type: process
      - id: exit
        label: "Shutdown or force exit"
        type: end
    findings:
      - slug: detached-signal-task-outlives-app-lifecycle
        title: "Duplicate signal registrations retain stale forced-exit state"
        criterion: "6.2"
        surface: Concurrency
        concern: moderate
        locations:
          - path: src/shutdown.rs
            start_line: 142
            end_line: 175
        evidence: |2
                  let handle = self.clone();

                  tracing::debug!("registering shutdown signal handlers");
                  runtime.spawn(async move {
                      loop {
                          #[cfg(unix)]
                          let signal = tokio::select! {
                              received = sigint.recv() => received.map(|()| ShutdownSignal::Interrupt),
                              received = sigterm.recv() => received.map(|()| ShutdownSignal::Terminate),
                          };

                          #[cfg(not(unix))]
                          let signal = ctrl_c_signal(tokio::signal::ctrl_c().await);

                          let Some(signal) = signal else {
                              tracing::error!("shutdown signal stream closed; signal task exiting");
                              return;
                          };

                          match action_for_signal(&handle, signal) {
                              SignalAction::Shutdown => {
                                  tracing::info!(signal = signal.name(), "shutdown signal received");
                              }
                              SignalAction::Exit(exit_code) => {
                                  tracing::warn!(
                                      signal = signal.name(),
                                      exit_code,
                                      "repeated shutdown signal received; forcing exit"
                                  );
                                  std::process::exit(exit_code);
                              }
                          }
                      }
                  });
        evidence_lang: rust
        evidence_markers:
          - lines: "1-5"
            type: del
            label: "The task owns a clone, loops forever, and discards its JoinHandle"
          - lines: "20-30"
            type: mark
            label: "Escalation state remains attached to the orphaned handle"
        mechanism: |
          Signal handling is intentionally permanent and process-wide, but each call to
          `register_signals` spawns another independent loop with its own cloned handle
          and escalation state. Tokio delivers notifications to every registered stream.
          If an earlier registration has entered shutdown state, a later registration's
          first signal is also observed by the stale loop and can call `process::exit`,
          bypassing the later handle's graceful-shutdown opportunity.
        remediation: |
          Preserve permanent process-wide handling, but use one process-global dispatcher
          and one escalation state. Reject duplicate registration or atomically update
          the active `ShutdownHandle` rather than spawning another independent loop.
        temporal:
          introduced: 2026-04-08
          last_modified: 2026-08-01
          commit_count: 6
          monthly_commits: [0, 0, 0, 0, 0, 0, 0, 4, 0, 0, 0, 2]
        chains:
          enables: []
          enabled_by: []
          related: []
        effort: medium
        effort_notes: "Centralizing process-wide signal ownership requires explicit duplicate-registration and handle-replacement semantics."

  - slug: cache-concurrency
    title: "The Cache Concurrency Surface"
    thesis: "Atomic replacement protects individual writes, but pruning can act on a pathname after its inspected inode has been replaced."
    verdict: "The race causes cache loss rather than data corruption or credential exposure. It is a real cross-task/process TOCTOU edge, but its impact is bounded to a miss and redundant refill."
