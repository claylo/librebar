            label: "tar defaults enable the xattr dependency"
        mechanism: |
          `tar` defaults to its `xattr` feature, adding `xattr` and `rustix` on Unix.
          That support is used while unpacking. Librebar's diagnostics implementation
          only creates archives with `tar::Builder`, so the feature and native-facing
          dependency path are unreachable from the delivered capability.
        remediation: |
          Declare `tar` with `default-features = false`. Archive creation does not
          require the xattr feature; verify the diagnostics feature afterward.
