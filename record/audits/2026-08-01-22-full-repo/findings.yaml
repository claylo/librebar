          enabled_by: []
          related: [crash-dump-errors-erased]
        effort: trivial
        effort_notes: "Documentation plus an additive strict/reporting API avoids breaking the existing best-effort behavior."

      - slug: logging-resolution-uses-string-errors
        title: "Public log-target resolution strips typed I/O sources"
        criterion: "5.4"
        surface: Error Handling
        concern: advisory
        locations:
          - path: src/logging.rs
            start_line: 188
            end_line: 217
        evidence: |
          pub fn resolve_log_target_with(
              service: &str,
              path_override: Option<PathBuf>,
              dir_override: Option<PathBuf>,
              config_dir: Option<PathBuf>,
          ) -> std::result::Result<LogTarget, String> {
              if let Some(path) = path_override {
                  return log_target_from_path(path);
              }

              if let Some(dir) = dir_override {
                  return log_target_from_dir(dir, service);
              }

              if let Some(dir) = config_dir {
                  return log_target_from_dir(dir, service);
              }

              let candidates = default_log_candidates(platform_log_dir(service));

              let file_name = format!("{service}{LOG_FILE_SUFFIX}");

              for dir in candidates {
                  if ensure_writable(&dir, &file_name).is_ok() {
                      return Ok(LogTarget { dir, file_name });
                  }
              }

              Err("No writable log directory found".to_string())
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "6"
            type: del
            label: "Public API returns String rather than a typed error"
          - lines: "24"
            type: del
            label: "Candidate-specific I/O failures are discarded"
          - lines: "29"
            type: del
            label: "Only a generic message reaches callers"
        mechanism: |
          The public API discards candidate I/O errors before returning a generic String.
          Callers cannot inspect the failing operation, path, `ErrorKind`, or source
          chain, so permission and filesystem failures are indistinguishable from a
          platform with no usable candidate directory.
        remediation: |
          Add a typed `try_resolve_log_target_with` API carrying attempted path,
          operation, and `std::io::Error`. Preserve candidate failures there, while
          retaining `resolve_log_target_with` as the String-returning compatibility wrapper.
        temporal:
          introduced: 2026-04-08
          last_modified: 2026-08-01
          commit_count: 17
          monthly_commits: [0, 0, 0, 0, 0, 0, 0, 9, 0, 0, 1, 7]
