    findings:
      - slug: dispatch-resolution-errors-collapse-to-not-found
        title: "Dispatch resolution failures are reported as a missing plugin"
        criterion: "5.3"
        surface: Error Handling
        concern: moderate
        locations:
          - path: src/dispatch.rs
            start_line: 38
            end_line: 53
        evidence: |
          pub fn resolve(app_name: &str, subcommand: &str) -> Option<PathBuf> {
              let binary = subcommand_binary(app_name, subcommand);
              let path = std::env::var_os("PATH")?;
              let absolute_paths: Vec<_> = std::env::split_paths(&path)
                  .filter(|entry| entry.is_absolute())
                  .collect();
              if absolute_paths.is_empty() {
                  return None;
              }

              let path = std::env::join_paths(absolute_paths).ok()?;
              let cwd = std::env::current_dir().ok()?;
              which::which_in(&binary, Some(path), cwd)
                  .ok()
                  .filter(|resolved| resolved.is_absolute())
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "11-14"
            type: del
            label: "Environment, filesystem, and resolver errors all become None"
        mechanism: |
          `None` means both "binary not found" and failure to join PATH, obtain the
          current directory, or resolve/canonicalize a candidate. `run` then converts
          these operational failures into `Ok(None)`, so callers report an unknown
          command instead of an inspectable dispatch failure.
        remediation: |
          Add a typed `try_resolve` API distinguishing `NotFound` from environment,
          current-directory, and resolver failures. Make `run` use it; retain `resolve`
          as a compatibility wrapper if needed.
        temporal:
          introduced: 2026-04-09
          last_modified: 2026-08-01
          commit_count: 6
          monthly_commits: [0, 0, 0, 0, 0, 0, 0, 5, 0, 0, 0, 1]
        chains: {enables: [], enabled_by: [], related: []}
        effort: small
        effort_notes: "Add one typed resolver and route the existing run path through it."

      - slug: crash-dump-errors-erased
        title: "Crash dump creation erases every failure cause"
        criterion: "5.4"
        surface: Error Handling
        concern: moderate
        locations:
          - path: src/crash.rs
            start_line: 162
            end_line: 194
        evidence: |
          pub fn write_crash_dump_to(info: &CrashInfo, dir: &Path) -> Option<PathBuf> {
              if std::fs::create_dir_all(dir).is_err() {
                  return None;
              }

              // Use timestamp chars that are safe in filenames
              let ts = info.timestamp.replace([':', '.'], "-");
              let filename = format!("{}-{}.crash", info.app_name, ts);
              let path = dir.join(&filename);

              let mut options = OpenOptions::new();
              options.write(true).create_new(true);

              #[cfg(unix)]
              {
                  use std::os::unix::fs::OpenOptionsExt as _;
                  options.mode(0o600);
              }

              let mut file = options.open(&path).ok()?;
              if serde_json::to_writer(&mut file, info).is_err() {
                  drop(file);
                  let _ = std::fs::remove_file(&path);
                  return None;
              }
              drop(file);

              if prune_crash_dumps(dir).is_err() {
                  let _ = std::fs::remove_file(&path);
                  return None;
              }
              Some(path)
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "2-4"
            type: del
            label: "Directory creation error is discarded"
          - lines: "20-24"
            type: del
            label: "Open and serialization failures collapse to None"
          - lines: "28-30"
            type: del
            label: "Retention and cleanup failures are erased"
        mechanism: |
          Directory creation, exclusive open, JSON serialization, pruning, and cleanup
          failures all return the same `None`. Public callers cannot distinguish
          permission denial, timestamp collision, disk exhaustion, serialization or
          write failure, or
          retention failure; ignored cleanup can also leave a partial file behind.
        remediation: |
          Add `CrashDumpError` with operation and path context plus a fallible
          `try_write_crash_dump_to`. The panic hook can intentionally degrade that
          result, while ordinary callers retain the source chain.
        temporal:
          introduced: 2026-04-08
          last_modified: 2026-08-01
          commit_count: 9
          monthly_commits: [0, 0, 0, 0, 0, 0, 0, 4, 0, 0, 1, 4]
        chains:
          enables: []
          enabled_by: []
          related: [cache-clear-reports-partial-success, logging-resolution-uses-string-errors]
        effort: small
        effort_notes: "A typed error and compatibility wrapper are localized to the crash module."

      - slug: cache-clear-reports-partial-success
        title: "Cache clear returns success after skipped entries and failed removals"
        criterion: "5.3"
        surface: Error Handling
        concern: advisory
        locations:
          - path: src/cache.rs
            start_line: 234
            end_line: 248
        evidence: |2
              pub fn clear(&self) -> Result<()> {
                  if self.dir.exists() {
                      for entry in std::fs::read_dir(&self.dir)
                          .map_err(CacheError::from)?
                          .flatten()
                      {
                          let path = entry.path();
                          if path.extension().and_then(|e| e.to_str()) == Some("cache") {
                              // Best-effort: skip files that can't be removed (permissions, etc.)
                              let _ = std::fs::remove_file(&path);
                          }
                      }
                  }
                  Ok(())
              }
        evidence_lang: rust
        evidence_markers:
          - lines: "5"
            type: del
            label: "ReadDir entry errors are skipped"
          - lines: "10"
            type: del
            label: "Removal failures are unobservable"
          - lines: "14"
            type: mark
            label: "Partial clearing is reported as success"
        mechanism: |
          The comment calls removal best-effort, but the public operation is named
          `clear` and exposes no partial-success report. Directory-entry errors and
          failed removals can leave cache data behind while `clear` returns `Ok(())`.
        remediation: |
          Document `clear` explicitly as best-effort to preserve its existing contract.
          Add a separately named strict/reporting API that propagates entry failures and
          returns removed and failed paths; treat only `NotFound` as successful removal.
        temporal:
          introduced: 2026-04-09
          last_modified: 2026-08-01
          commit_count: 13
          monthly_commits: [0, 0, 0, 0, 0, 0, 0, 5, 0, 0, 1, 7]
