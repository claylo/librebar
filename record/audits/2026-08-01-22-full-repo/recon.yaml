testing:
  runner: just
  command: just test
  sources:
    - .justfile
    - .config/nextest.toml
  notes: "`.config/nextest.toml` is present — the wrapper command likely invokes `cargo nextest run`.
    Do not invoke `cargo test` directly: env-mutating tests assume nextest process isolation."
boundaries:
  - name: external_configuration
    description: "Layered files, environment variables, and programmatic overrides become typed application configuration"
    modules: [config, crate-root]
    notes: "Untrusted text crosses Serde and path-discovery boundaries before consumers receive typed values."
  - name: filesystem_persistence
    description: "Cache entries, logs, crash dumps, lockfiles, cookie jars, and diagnostic archives are created or replaced on local filesystems"
    modules: [cache, logging, crash, diagnostics, lockfile, http]
    notes: "Atomicity, permissions, symlink handling, archive paths, and durability are the primary properties."
  - name: network_and_credentials
    description: "HTTP, update checks, cookies, cached representations, and telemetry cross network trust boundaries"
    modules: [http, update, otel]
    notes: "Redirect policy, decompression limits, credential persistence, cookie scope, TLS, and cache semantics are security-sensitive."
  - name: cli_and_process_dispatch
    description: "Caller-controlled CLI trees and Git-style plugin names become schemas, generated artifacts, paths, and child-process execution"
    modules: [cli, dispatch]
    notes: "Argument conflicts, path lookup, generated output, and executable selection form the public command boundary."
  - name: asynchronous_lifecycle
    description: "Tokio-backed HTTP, shutdown, MCP, and telemetry code coordinate tasks, signals, transports, and blocking adapters"
    modules: [http, shutdown, mcp, otel, update]
    notes: "Cancellation, blocking work, shared state, and runtime ownership are the primary concurrency concerns."
